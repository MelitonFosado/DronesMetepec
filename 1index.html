<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajolote</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .nav-logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #fff;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 3px;
            opacity: 0.8;
        }

        .nav-links a:hover {
            opacity: 1;
        }

        /* HERO */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .hero iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .hero-texto {
            position: absolute;
            bottom: 80px;
            left: 60px;
            z-index: 10;
        }

        .hero-texto h1 {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .hero-texto p {
            font-size: 18px;
            letter-spacing: 2px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <div class="nav-logo">AJOLOTE</div>
        <ul class="nav-links">
            <li><a href="#videos">VIDEOS</a></li>
            <li><a href="#contacto">CONTACTO</a></li>
        </ul>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <iframe
            id="ytplayer"
            src="https://www.youtube.com/embed/dlAjYemMvb8?autoplay=1&mute=1&controls=0&showinfo=0&rel=0&modestbranding=1&vq=hd1080&enablejsapi=1"
            frameborder="0"
            allow="autoplay; fullscreen">
        </iframe>

        <div class="hero-texto">
            <h1>Meliton Fosado</h1>
            <p>FPV & AERIAL CINEMATOGRAPHY</p>
        </div>
    </section>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        var player;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytplayer', {
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            event.target.setPlaybackQuality('hd1080');
            event.target.playVideo();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                player.setPlaybackQuality('hd1080');
                player.seekTo(0);
                player.playVideo();
            }
        }
    </script>

</body>
</html>
