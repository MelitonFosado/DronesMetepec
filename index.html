<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajolote</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .hero iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .hero-texto {
            position: absolute;
            bottom: 80px;
            left: 60px;
            z-index: 10;
        }

        .hero-texto h1 {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .hero-texto p {
            font-size: 18px;
            letter-spacing: 2px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <section class="hero">
        <iframe
            src="https://www.youtube.com/embed/dlAjYemMvb8?autoplay=1&mute=1&loop=1&playlist=dlAjYemMvb8&controls=0&showinfo=0&rel=0&modestbranding=1"
            frameborder="0"
            allow="autoplay; fullscreen">
        </iframe>

        <div class="hero-texto">
            <h1>Meliton Fosado</h1>
            <p>FPV & AERIAL CINEMATOGRAPHY</p>
        </div>
    </section>

</body>
</html>
