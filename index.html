<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AerialRobotics.org</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .nav-logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #fff;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 40px;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 3px;
            opacity: 0.8;
        }
        .nav-links a:hover {
            opacity: 1;
        }

        /* SECCIONES DE VIDEO */
        .video-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .video-section iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* TEXTO SOBRE VIDEO */
        .video-texto {
            position: absolute;
            bottom: 80px;
            left: 60px;
            z-index: 10;
        }
        .video-texto h1 {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .video-texto h2 {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .video-texto p {
            font-size: 18px;
            letter-spacing: 2px;
            color: #aaa;
            margin-top: 10px;
        }

        /* GRADIENTE INFERIOR para legibilidad del texto */
        .video-section::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <div class="nav-logo">AJOLOTE</div>
        <ul class="nav-links">
            <li><a href="#videos">VIDEOS</a></li>
            <li><a href="#contacto">CONTACTO</a></li>
        </ul>
    </nav>

    <!-- VIDEO 1 — HERO -->
    <section class="video-section" id="hero">
        <iframe
            id="ytplayer1"
            src="https://www.youtube.com/embed/dlAjYemMvb8?autoplay=1&mute=1&controls=0&showinfo=0&rel=0&modestbranding=1&vq=hd1080&enablejsapi=1"
            frameborder="0"
            allow="autoplay; fullscreen">
        </iframe>
        <div class="video-texto">
            <h1>Meliton Fosado</h1>
            <p>FPV & AERIAL CINEMATOGRAPHY</p>
        </div>
    </section>

    <!-- VIDEO 2 — SEGUNDA SECCIÓN -->
    <section class="video-section" id="videos">
        <iframe
            id="ytplayer2"
            src="https://www.youtube.com/embed/tdeee6Sju9Q?mute=1&controls=0&showinfo=0&rel=0&modestbranding=1&vq=hd1080&enablejsapi=1"
            frameborder="0"
            allow="autoplay; fullscreen">
        </iframe>
        <div class="video-texto">
            <h2>Aerial Footage</h2>
            <p>DJI FPV — Mexico</p>
        </div>
    </section>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        var player1, player2;

        function onYouTubeIframeAPIReady() {
            player1 = new YT.Player('ytplayer1', {
                events: {
                    'onReady': function(e) {
                        e.target.setPlaybackQuality('hd1080');
                        e.target.playVideo();
                    },
                    'onStateChange': function(e) {
                        if (e.data === YT.PlayerState.ENDED) {
                            player1.setPlaybackQuality('hd1080');
                            player1.seekTo(0);
                            player1.playVideo();
                        }
                    }
                }
            });

            player2 = new YT.Player('ytplayer2', {
                events: {
                    'onReady': function(e) {
                        e.target.setPlaybackQuality('hd1080');
                    },
                    'onStateChange': function(e) {
                        if (e.data === YT.PlayerState.ENDED) {
                            player2.setPlaybackQuality('hd1080');
                            player2.seekTo(0);
                            player2.playVideo();
                        }
                    }
                }
            });
        }

        // Detecta cuando el segundo video es visible y lo reproduce
        const observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    if (player2) {
                        player2.setPlaybackQuality('hd1080');
                        player2.playVideo();
                    }
                } else {
                    if (player2) {
                        player2.pauseVideo();
                    }
                }
            });
        }, { threshold: 0.5 });

        observer.observe(document.getElementById('videos'));
    </script>

</body>
</html>
