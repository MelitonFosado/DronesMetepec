<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AerialRobotics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .nav-logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #fff;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 40px;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 3px;
            opacity: 0.8;
        }
        .nav-links a:hover {
            opacity: 1;
        }

        /* SECCIONES DE VIDEO */
        .video-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .video-section iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* TEXTO SOBRE VIDEO */
        .video-texto {
            position: absolute;
            bottom: 80px;
            left: 60px;
            z-index: 10;
        }
        .video-texto h1 {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .video-texto h2 {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .video-texto p {
            font-size: 18px;
            letter-spacing: 2px;
            color: #aaa;
            margin-top: 10px;
        }

        /* GRADIENTE INFERIOR */
        .video-section::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <div class="nav-logo">Xinantécatl</div>
        <ul class="nav-links">
            <li><a href="#videos">VIDEOS</a></li>
            <li><a href="#contacto">CONTACTO</a></li>
        </ul>
    </nav>

    <!-- VIDEO 1 — HERO -->
    <section class="video-section" id="hero">
        <iframe
            id="ytplayer1"
            src="https://www.youtube.com/embed/dlAjYemMvb8?autoplay=1&mute=1&controls=0&showinfo=0&rel=0&modestbranding=1&vq=hd1080&enablejsapi=1"
            frameborder="0"
            allow="autoplay; fullscreen">
        </iframe>
        <div class="video-texto">
            <h1>Nevado de Toluca</h1>
            <p>FPV & AERIAL CINEMATOGRAPHY</p>
        </div>
    </section>

    <!-- VIDEO 2 -->
    <section class="video-section" id="videos">
        <iframe
            id="ytplayer2"
            src="https://www.youtube.com/embed/tdeee6Sju9Q?mute=1&controls=0&showinfo=0&rel=0&modestbranding=1&vq=hd1080&enablejsapi=1"
            frameborder="0"
            allow="autoplay; fullscreen">
        </iframe>
        <div class="video-texto">
            <h2>Aerial Footage</h2>
            <p>FPV — México</p>
        </div>
    </section>

    <!-- VIDEO 3 -->
    <section class="video-section" id="video3">
        <iframe
            id="ytplayer3"
            src="https://www.youtube.com/embed/F8VfjT8QA0k?mute=1&controls=0&showinfo=0&rel=0&modestbranding=1&vq=hd1080&enablejsapi=1"
            frameborder="0"
            allow="autoplay; fullscreen">
        </iframe>
        <div class="video-texto">
            <h2>FPV Freestyle</h2>
            <p>FPV— México</p>
        </div>
    </section>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        var player1, player2, player3;

        function onYouTubeIframeAPIReady() {
            // PLAYER 1 — autoplay al cargar
            player1 = new YT.Player('ytplayer1', {
                events: {
                    'onReady': function(e) {
                        e.target.setPlaybackQuality('hd1080');
                        e.target.playVideo();
                    },
                    'onStateChange': function(e) {
                        if (e.data === YT.PlayerState.ENDED) {
                            player1.setPlaybackQuality('hd1080');
                            player1.seekTo(0);
                            player1.playVideo();
                        }
                    }
                }
            });

            // PLAYER 2
            player2 = new YT.Player('ytplayer2', {
                events: {
                    'onReady': function(e) {
                        e.target.setPlaybackQuality('hd1080');
                    },
                    'onStateChange': function(e) {
                        if (e.data === YT.PlayerState.ENDED) {
                            player2.setPlaybackQuality('hd1080');
                            player2.seekTo(0);
                            player2.playVideo();
                        }
                    }
                }
            });

            // PLAYER 3
            player3 = new YT.Player('ytplayer3', {
                events: {
                    'onReady': function(e) {
                        e.target.setPlaybackQuality('hd1080');
                    },
                    'onStateChange': function(e) {
                        if (e.data === YT.PlayerState.ENDED) {
                            player3.setPlaybackQuality('hd1080');
                            player3.seekTo(0);
                            player3.playVideo();
                        }
                    }
                }
            });
        }

        // Detecta visibilidad y controla reproducción
        function observarVideo(seccionId, getPlayer) {
            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    var p = getPlayer();
                    if (!p) return;
                    if (entry.isIntersecting) {
                        p.setPlaybackQuality('hd1080');
                        p.playVideo();
                    } else {
                        p.pauseVideo();
                    }
                });
            }, { threshold: 0.5 });

            observer.observe(document.getElementById(seccionId));
        }

        observarVideo('videos',  function() { return player2; });
        observarVideo('video3',  function() { return player3; });
    </script>

</body>
</html>
