<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajolote</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .nav-logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #fff;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 40px;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 3px;
            opacity: 0.8;
        }
        .nav-links a:hover {
            opacity: 1;
        }

        /* SECCIONES DE VIDEO */
        .video-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .video-section iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* TEXTO SOBRE VIDEO */

            position: absolute;
            bottom: 80px;
            left: 60px;
            z-index: 10;
        }
